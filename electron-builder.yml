appId: io.github.dcss-deck
productName: DCSS Deck
directories:
  output: release
files:
  - dist/**
  - package.json
# Offline play: run scripts/bundle-offline.sh first (CI does). See src/main/paths.ts.
extraResources:
  - from: bundle/crawl
    to: crawl
  - from: bundle/python
    to: python
  - from: server
    to: server
    filter: ["**/*", "!__pycache__"]
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  artifactName: DCSS-Deck-${version}-x86_64.AppImage
